<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>For Riya ✿</title><link rel="stylesheet" href="common.css"><style>
body{--a:#fff7ef;--b:#ffe8ee;--c:#fbd9e6;--ink:#7a5566;--hd:#c9577f;--pc:#a98794;--f1:#f6b3c6;--f2:#ffd8ab}
main{gap:1.7rem}#m{min-height:1.6em;font-size:1.1rem}
</style></head><body data-gate="1" data-p="22"><main>
<p class="cap rise">a little something, made only for</p>
<h1 data-s>Riya ✿</h1>
<p class="cap rise" style="--i:4">enter the secret code</p>
<div class="bx rise" id="bx" style="--i:5"><i></i><i></i><i></i><i></i></div>
<div class="kp rise" id="kp" style="--i:6"></div>
<small id="m">hint: the year you were born 🌼</small>
</main><script src="config.js"></script><script src="common.js"></script><script>
const bx=document.getElementById('bx'),m=document.getElementById('m');let v='';
document.getElementById('kp').innerHTML=[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>`<button class="gk">${k}</button>`).join('');
const draw=()=>[...bx.children].forEach((e,i)=>e.textContent=v[i]?'✱':'');
function chk(){if(v==='2007'){sessionStorage.setItem('riya','1');m.textContent='yay… opening ✿';petals(45,true);setTimeout(()=>go('door.html'),1000)}else if(v.length==4){bx.animate([{transform:'none'},{transform:'translateX(-12px)'},{transform:'translateX(12px)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'none'}],500);m.textContent='hmm, not quite… try again 🌸';v='';draw()}}
function key(k){if(k=='⌫')v=v.slice(0,-1);else if(/^\d$/.test(k)&&v.length<4)v+=k;draw();if(v.length==4)setTimeout(chk,250)}
document.querySelectorAll('.gk').forEach(b=>b.onclick=()=>key(b.textContent));
addEventListener('keydown',e=>key(e.key=='Backspace'?'⌫':e.key));
</script></body></html>
